# Render Blueprint for the Dukkani demo.
#
# The blueprint lives at the repository root and builds the Laravel app in
# dukkani-app/. If you split the app into its own repository, move this file
# into that repository and drop rootDir / dockerfilePath / dockerContext.
#
# This file targets Render's free plan, so there is no persistent disk: the
# container filesystem is ephemeral and starts empty on every deploy/restart.
# The entrypoint creates the SQLite file, migrates, and seeds the demo on the
# first boot, so the demo is always usable.
#
# To keep data between deploys (and keep the service always on), add a payment
# method to the workspace, set plan to a paid instance type, and restore the
# disk block below.
#
#     plan: starter
#     disk:
#       name: dukkani-data
#       mountPath: /var/data
#       sizeGB: 1
#
# Note: maxShutdownDelaySeconds is not allowed on a service that mounts a disk.

services:
  - type: web
    name: dukkani-demo
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    rootDir: dukkani-app
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeployTrigger: commit

    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: ar
      - key: APP_FALLBACK_LOCALE
        value: ar
      - key: APP_FAKER_LOCALE
        value: ar_JO
      - key: APP_TIMEZONE
        value: Asia/Amman
      - key: TZ
        value: Asia/Amman

      # Demo controls: one-click login and visible sample-data labels.
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_SEED
        value: "true"

      # SQLite in the container (ephemeral on the free plan). WAL keeps reads
      # and writes cheap while the dashboard and storefront are used together.
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/data/database.sqlite
      - key: DB_BUSY_TIMEOUT
        value: "5000"
      - key: DB_JOURNAL_MODE
        value: WAL
      - key: DB_SYNCHRONOUS
        value: NORMAL

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local

      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: MAIL_MAILER
        value: log
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: APP_MAINTENANCE_DRIVER
        value: file

    # APP_KEY is generated once and stored under /var/data by the entrypoint.
    # APP_URL is taken from Render's RENDER_EXTERNAL_URL automatically.
    # Set either variable here if you prefer to manage them yourself.
