# Render Blueprint for the Dukkani demo.
#
# The blueprint lives at the repository root and builds the Laravel app in
# dukkani-app/. If you split the app into its own repository, move this file
# into that repository and drop rootDir / dockerfilePath / dockerContext.
#
# This file targets Render's free plan, so there is no persistent disk: the
# container filesystem is ephemeral and starts empty on every deploy/restart.
# The entrypoint creates the SQLite file, migrates, and seeds the demo on the
# first boot, so the demo is always usable.
#
# To keep data between deploys (and keep the service always on), add a payment
# method to the workspace, set plan to a paid instance type, and restore the
# disk block below.
#
#     plan: starter
#     disk:
#       name: dukkani-data
#       mountPath: /var/data
#       sizeGB: 1
#
# Note: maxShutdownDelaySeconds is not allowed on a service that mounts a disk.

services:
  - type: web
    name: dukkani-demo
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    rootDir: dukkani-app
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeployTrigger: commit

    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: ar
      - key: APP_FALLBACK_LOCALE
        value: ar
      - key: APP_FAKER_LOCALE
        value: ar_JO
      - key: APP_TIMEZONE
        value: Asia/Amman
      - key: TZ
        value: Asia/Amman

      # Demo controls: one-click login and visible sample-data labels.
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_SEED
        value: "true"

      # SQLite in the container (ephemeral on the free plan). WAL keeps reads
      # and writes cheap while the dashboard and storefront are used together.
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/data/database.sqlite
      - key: DB_BUSY_TIMEOUT
        value: "5000"
      - key: DB_JOURNAL_MODE
        value: WAL
      - key: DB_SYNCHRONOUS
        value: NORMAL

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "43200"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local

      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: MAIL_MAILER
        value: log
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: APP_MAINTENANCE_DRIVER
        value: file

      # Web Push (VAPID). The same key pair can serve both services; only the
      # subject URL differs. Rotating the keys drops every saved device.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: https://dukkani-demo.onrender.com

    # APP_KEY is generated once and stored under /var/data by the entrypoint.
    # APP_URL is taken from Render's RENDER_EXTERNAL_URL automatically.
    # Set either variable here if you prefer to manage them yourself.

  # Production service: Neon Postgres + Cloudinary. No disk is mounted, so every
  # value that must survive a restart is provided by Render, and `sync: false`
  # prompts for the secret values when the Blueprint is applied.
  - type: web
    name: dukkani-prod
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    rootDir: dukkani-app
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeployTrigger: commit

    envVars:
      - key: APP_NAME
        value: Dukkani
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://dukkani-prod.onrender.com

      - key: APP_LOCALE
        value: ar
      - key: APP_FALLBACK_LOCALE
        value: ar
      - key: APP_FAKER_LOCALE
        value: ar_JO
      - key: APP_TIMEZONE
        value: Asia/Hebron
      - key: TZ
        value: Asia/Hebron

      - key: DEMO_MODE
        value: "false"
      - key: DEMO_SEED
        value: "false"

      # Root URL target. Set this in the Render dashboard once the first real
      # store exists (for example: amal-bakes).
      - key: DEFAULT_STORE_SLUG
        sync: false

      # Platform support contact shown on the storefront "store is full" page
      # and on the owner upgrade prompts. Set DUKKANI_SUPPORT_WHATSAPP to the
      # real support number in international format, for example 970599123456.
      - key: DUKKANI_SUPPORT_WHATSAPP
        sync: false
      - key: DUKKANI_SUPPORT_NAME
        value: دعم دكّاني

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        sync: false

      - key: CLOUDINARY_URL
        sync: false

      # Web Push (VAPID). Generate once and keep stable.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: https://dukkani-prod.onrender.com

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "43200"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local

      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: MAIL_MAILER
        value: log
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: APP_MAINTENANCE_DRIVER
        value: file
